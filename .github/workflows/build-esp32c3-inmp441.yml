



name: Build esp32c3-inmp441
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main/**"
      - "partitions/**"
      - "scripts/**"
      - "sdkconfig.defaults*"
      - "config.json"
      - ".github/workflows/build-esp32c3-inmp441.yml"

jobs:
  build:
    name: esp32c3-inmp441
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v5.5.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare ESP-IDF
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --version
          python --version

      - name: esp32c3-inmp441
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"

          python scripts/release.py esp32c3-inmp441 \
            --name esp32c3-inmp441 \

      - name: Verify firmware
        shell: bash
        run: |
          test -s build/merged-binary.bin
          ls -lh build/merged-binary.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-inmp441
          path: build/merged-binary.bin
          if-no-files-found: error
          retention-days: 14
